<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Тренировки">
<title>Тренировки</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="view"></main>

<div id="rest" class="rest" hidden>
  <svg class="ring" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="19" class="ring-bg"/><circle cx="22" cy="22" r="19" class="ring-fg" id="ringFg"/></svg>
  <div class="rest-txt"><small>Отдых</small><b id="restTime">0:00</b></div>
  <button class="pill" data-a="rest-add" data-v="-15">−15</button>
  <button class="pill" data-a="rest-add" data-v="15">+15</button>
  <button class="pill pill-accent" data-a="rest-skip">Готов</button>
</div>

<div id="restFull" class="restfull" hidden>
  <small id="rfLabel">Отдых</small>
  <div class="rf-ring">
    <svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="90" class="ring-bg"/><circle cx="100" cy="100" r="90" class="ring-fg" id="rfRing"/></svg>
    <b id="rfTime">0:00</b>
  </div>
  <div class="rf-next" id="rfNext"></div>
  <div class="row" style="justify-content:center">
    <button class="pill" data-a="rest-add" data-v="-15">−15 с</button>
    <button class="pill" data-a="rest-add" data-v="15">+15 с</button>
  </div>
  <button class="btn" id="rfSkip" data-a="rest-skip">Пропустить</button>
</div>

<nav class="tabs" id="tabs">
  <button data-a="tab" data-t="today"><svg viewBox="0 0 24 24"><path d="M6.5 8v8M17.5 8v8M3.5 10v4M20.5 10v4M6.5 12h11"/></svg><span>Сегодня</span></button>
  <button data-a="tab" data-t="muscles"><svg viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2.2"/><path d="M5 9l7 1.5L19 9M12 10.5V15M12 15l-3 6M12 15l3 6"/></svg><span>Мышцы</span></button>
  <button data-a="tab" data-t="history"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>История</span></button>
  <button data-a="tab" data-t="progress"><svg viewBox="0 0 24 24"><path d="M4 19h16M6 15l4-5 3 3 5-7"/></svg><span>Прогресс</span></button>
  <button data-a="tab" data-t="settings"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/><circle cx="9" cy="7" r="1.8"/><circle cx="15" cy="12" r="1.8"/><circle cx="8" cy="17" r="1.8"/></svg><span>Программа</span></button>
</nav>

<div id="sheet" class="sheet" hidden><div class="sheet-bg" data-a="sheet-close"></div><div class="sheet-body" id="sheetBody"></div></div>
<div id="toast" class="toast" hidden></div>

<script src="lib.js"></script>
<script src="app.js"></script>
</body>
</html>
